# Production compose for the API directory on the VM (DEPLOY_DIR in the workflow,
# default /data/stack/apps/time-4-action/export/api). CI exports
# APP_IMAGE=ghcr.io/time-4-action/t4a-partner-portal-api:<commit sha>; without it
# this runs :latest. The VM never builds: images come from GHCR. Copy changes to
# the server by hand; the deploy only swaps images.
services:
  t4a-partner-portal-api:
    image: ${APP_IMAGE:-ghcr.io/time-4-action/t4a-partner-portal-api:latest}
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - /data/stack/apps/time-4-action/export/api/data/.env
    volumes:
      - /data/stack/apps/time-4-action/export/api/data:/data
